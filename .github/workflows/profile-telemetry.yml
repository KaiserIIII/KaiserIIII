name: Refresh portfolio information design

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1,4'
  push:
    paths:
      - '.github/workflows/profile-telemetry.yml'
      - 'tools/render_live_metrics.py'
      - 'tests/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: public-profile-telemetry
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test data boundaries, typography and SVG output
        run: python3 -m unittest discover -s tests -v
      - name: Refresh diagrams and public-only dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/render_live_metrics.py --output assets/live-dashboard.svg --art-dir assets
      - name: Commit generated assets if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git add assets/profile-hero.svg assets/project-atlas.svg assets/engineering-loop.svg assets/evidence-board.svg assets/live-dashboard.svg
          if git diff --cached --quiet; then
            echo 'SVGs already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate editorial portfolio [skip ci]'
          git push
