name: Publish interactive engineering experience

on:
  push:
    branches: [main]
    paths:
      - 'experience/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload interactive HTML app
        uses: actions/upload-pages-artifact@v3
        with:
          path: experience
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
