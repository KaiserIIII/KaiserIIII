name: Validate and render interactive portfolio motion
on:
  push:
    paths:
      - 'experience/**'
      - 'tools/render_motion.py'
      - 'tools/check_experience.py'
      - 'tests/test_experience.py'
      - '.github/workflows/experience.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-motion
  cancel-in-progress: false
jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check interactive application JavaScript
        run: python tools/check_experience.py
      - name: Test interaction markup and privacy constraints
        run: python -m unittest discover -s tests -p 'test_experience.py' -v
      - name: Install Pillow for motion graphics
        run: python -m pip install Pillow==11.3.0
      - name: Render animated editorial cover
        run: python tools/render_motion.py --output assets/portrait-motion.gif
      - name: Commit generated GIF
        run: |
          git add assets/portrait-motion.gif
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh animated portrait [skip ci]'
          git push
