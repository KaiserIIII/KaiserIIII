<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="652" viewBox="0 0 1200 652" role="img" aria-label="Diagram connecting technical capabilities to representative repositories."><rect x="0" y="0" width="1200" height="652" rx="20" fill="#F8F5EF" stroke="none" stroke-width="0"/><text x="50" y="65" font-size="38" font-weight="500" fill="#342F2B" font-family="Georgia,Times New Roman,serif">A capability map, backed by code.</text><text x="51" y="94" font-size="16" font-weight="400" fill="#736B63" font-family="Segoe UI,Arial,sans-serif">Connections describe relevant implementation evidence—not ability scores.</text><text x="52" y="139" font-size="13" font-weight="700" fill="#C67858" font-family="Segoe UI,Arial,sans-serif">CAPABILITY</text><text x="823" y="139" font-size="13" font-weight="700" fill="#C67858" font-family="Segoe UI,Arial,sans-serif">EVIDENCE / PUBLIC CODE</text><path d="M399 197 C535 197, 656 175, 797 175" fill="none" stroke="#C67858" stroke-width="1.7" opacity=".65"/><path d="M399 197 C535 197, 656 247, 797 247" fill="none" stroke="#C67858" stroke-width="1.7" opacity=".65"/><path d="M399 197 C535 197, 656 463, 797 463" fill="none" stroke="#C67858" stroke-width="1.7" opacity=".65"/><path d="M399 301 C535 301, 656 247, 797 247" fill="none" stroke="#667D70" stroke-width="1.7" opacity=".65"/><path d="M399 301 C535 301, 656 319, 797 319" fill="none" stroke="#667D70" stroke-width="1.7" opacity=".65"/><path d="M399 301 C535 301, 656 391, 797 391" fill="none" stroke="#667D70" stroke-width="1.7" opacity=".65"/><path d="M399 301 C535 301, 656 463, 797 463" fill="none" stroke="#667D70" stroke-width="1.7" opacity=".65"/><path d="M399 405 C535 405, 656 175, 797 175" fill="none" stroke="#697F98" stroke-width="1.7" opacity=".65"/><path d="M399 405 C535 405, 656 319, 797 319" fill="none" stroke="#697F98" stroke-width="1.7" opacity=".65"/><path d="M399 405 C535 405, 656 391, 797 391" fill="none" stroke="#697F98" stroke-width="1.7" opacity=".65"/><path d="M399 509 C