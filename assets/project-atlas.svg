ests</text><rect x="802" y="434" width="351" height="61" rx="11" fill="#FFFCF7" stroke="#E5DBCD" stroke-width="1"/><circle cx="797" cy="463" r="4" fill="#C67858"/><text x="822" y="459" font-size="19" font-weight="650" fill="#342F2B" font-family="Segoe UI,Arial,sans-serif">Cost Analyzer</text><text x="822" y="482" font-size="13" font-weight="400" fill="#736B63" font-family="Segoe UI,Arial,sans-serif">BOQ / Decimal calculations</text><rect x="802" y="506" width="351" height="61" rx="11" fill="#FFFCF7" stroke="#E5DBCD" stroke-width="1"/><circle cx="797" cy="535" r="4" fill="#C67858"/><text x="822" y="531" font-size="19" font-weight="650" fill="#342F2B" font-family="Segoe UI,Arial,sans-serif">ReproShift</text><text x="822" y="554" font-size="13" font-weight="400" fill="#736B63" font-family="Segoe UI,Arial,sans-serif">reproducible experiments</text><path d="M51 619L1152 619" fill="none" stroke="#E5DBCD" stroke-width="1"/><text x="51" y="640" font-size="12" font-weight="400" fill="#736B63" font-family="Segoe UI,Arial,sans-serif">LINKED PROJECTS ARE EXAMPLES, NOT A BENCHMARK OF PERSONAL SKILL.</text></svg>
